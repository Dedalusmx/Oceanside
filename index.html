<style>
/* ══════════════════════════════════════════════════════════
   OCEANSIDE PROPERTIES — Identidad 2026
   Concepto: "Piedra y agua" — travertino (marfil/arena) +
   línea de agua turquesa como único acento de firma.
   Marfil 70 · Arena 15 · Turquesa 10 · Carbón 5
   ══════════════════════════════════════════════════════════ */
:root{
  --ivory:#F0F2F4;
  --sand:#EAE2D6;
  --sand-dk:#DFD5C6;
  --turq:#36B8C9;
  --turq-dk:#2A9DAD;
  --char:#292B29;
  --muted:#5F615C;
  --line:rgba(41,43,41,.12);
  --line-strong:rgba(41,43,41,.24);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  /* Alias heredados (JS y páginas que aún usan los nombres viejos) */
  --gold:var(--turq);--gold-lt:var(--turq);--gold-dk:var(--turq-dk);
  --bg:var(--ivory);--bg2:var(--sand);--bg3:var(--ivory);
  --text:var(--char);--dim:var(--muted);--border:var(--line)
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--char);font-family:var(--sans);font-weight:400;overflow-x:hidden;-webkit-font-smoothing:antialiased;opacity:0;animation:bodyIn .6s .1s forwards}
img{max-width:100%;display:block}
::selection{background:rgba(54,184,201,.22);color:var(--char)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--turq);outline-offset:3px}

/* Superficie travertino: bandas horizontales casi imperceptibles */
.travertine{background-color:var(--sand);background-image:
  repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 9px),
  repeating-linear-gradient(0deg,rgba(41,43,41,.014) 0 2px,transparent 2px 37px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.1) 0 3px,transparent 3px 61px)}

/* ── NAV ── */
#nav{position:fixed;top:0;left:0;right:0;z-index:100;height:80px;padding:0 6%;display:flex;align-items:center;transition:background .45s,border-color .45s;border-bottom:1px solid transparent}
#nav.scrolled{background:rgba(240,242,244,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--line)}
.nav-inner{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.nav-logo img{height:42px;object-fit:contain}
.nav-links{display:flex;list-style:none;gap:40px;justify-content:center}
.nav-links a{text-decoration:none;font-size:11px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;color:rgba(240,242,244,.88);position:relative;padding-bottom:6px;transition:color .3s}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--turq);transition:width .4s var(--ease)}
.nav-links a:hover{color:var(--ivory)}
.nav-links a:hover::after{width:100%}
#nav.scrolled .nav-links a{color:var(--char)}
.lang-sw{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.lang-btn{background:none;border:none;font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:1.5px;color:rgba(240,242,244,.65);cursor:pointer;padding:4px 3px;border-bottom:2px solid transparent;transition:color .25s,border-color .25s}
.lang-btn:hover{color:var(--ivory)}
.lang-btn.active{color:var(--ivory);border-color:var(--turq)}
.lang-sep{color:rgba(240,242,244,.35);font-size:6px;user-select:none}
#nav.scrolled .lang-btn{color:var(--muted)}
#nav.scrolled .lang-btn:hover,#nav.scrolled .lang-btn.active{color:var(--char)}
#nav.scrolled .lang-sep{color:var(--line-strong)}

/* Logo flotante: marfil sobre la foto, carbón al acoplarse a la barra */
#fLogo{position:fixed;z-index:101;cursor:pointer;pointer-events:auto;height:auto;transform-origin:top left;filter:none;transition:filter .45s}
#nav.scrolled ~ #fLogo{filter:brightness(0) invert(.16)}

/* ── HERO ── */
#hero{position:relative;height:100vh;min-height:680px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--char)}
.h-bg{position:absolute;inset:0;background:url('https://res.cloudinary.com/dphbptped/image/upload/w_1920,q_auto,f_auto/v1781837893/file_000000008cc471f8a10de7de92779e60_jb9i1q.png') center/cover no-repeat;transform:scale(1.08);transition:transform 11s ease}
.h-bg.ready{transform:scale(1)}
.h-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(41,43,41,.2) 0%,rgba(41,43,41,.06) 30%,rgba(41,43,41,.28) 62%,rgba(41,43,41,.6) 100%)}
.h-cnt{position:relative;z-index:2;text-align:center;padding:0 24px;max-width:920px;margin-top:22vh}
.h-orn{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:32px;opacity:0;animation:up .9s .25s forwards}
.h-orn::before,.h-orn::after{content:'';width:44px;height:2px;background:var(--turq)}
.h-orn-txt{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:rgba(240,242,244,.9);font-weight:400}
.h-title{font-family:var(--serif);font-size:clamp(50px,8.5vw,108px);font-weight:300;line-height:1;color:var(--ivory);letter-spacing:-.02em;opacity:0;animation:up .9s .42s forwards}
.h-title em{font-style:italic;color:var(--ivory)}
.h-slogan{font-family:var(--serif);font-size:clamp(17px,1.8vw,23px);font-weight:400;font-style:italic;color:rgba(240,242,244,.88);margin:22px 0 44px;letter-spacing:.01em;opacity:0;animation:up .9s .52s forwards}
.h-loc{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:rgba(240,242,244,.75);margin:16px 0 44px;opacity:0;animation:up .9s .6s forwards}
.h-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;opacity:0;animation:up .9s .78s forwards}

/* ── BOTONES ── */
.btn-g{display:inline-block;padding:17px 40px;background:var(--turq);color:var(--char);text-decoration:none;font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;transition:background .3s,color .3s;white-space:nowrap}
.btn-g:hover{background:var(--ivory);color:var(--char)}
.btn-o{display:inline-block;padding:16px 40px;border:1px solid rgba(240,242,244,.6);color:var(--ivory);text-decoration:none;font-size:11px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;transition:background .3s,color .3s,border-color .3s;white-space:nowrap}
.btn-o:hover{background:var(--ivory);border-color:var(--ivory);color:var(--char)}

/* ── MANIFESTO ── */
#manifesto{padding:136px 6% 128px;background:var(--ivory);text-align:center}
.gline{display:flex;align-items:center;justify-content:center;gap:0;margin:40px auto}
.gline::before,.gline::after{content:'';flex:1;max-width:110px;height:1px;background:var(--line-strong)}
.gdot{width:28px;height:2px;background:var(--turq);flex-shrink:0}
.mf-ti{font-family:var(--serif);font-size:clamp(34px,4.6vw,60px);font-weight:300;font-style:italic;color:var(--char);margin:0 auto 30px;line-height:1.15;max-width:900px}
.mf-tx{max-width:700px;margin:0 auto;font-size:16px;line-height:1.95;color:var(--muted);font-weight:300}
.mf-tx p{margin:0 0 1.3em}
.mf-tx .mf-sign{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,25px);font-weight:400;line-height:1.5;color:var(--char);margin:40px 0 0}

/* ── SECCIONES COMUNES ── */
.sec{padding:120px 0}
.s-in{max-width:1300px;margin:0 auto;padding:0 6%}
.s-hd{text-align:left;margin-bottom:64px;max-width:820px}
.s-ey{display:block;font-size:11px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.s-ti{font-family:var(--serif);font-size:clamp(30px,3.6vw,46px);font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--char);line-height:1.1}
.s-div{display:block;margin-top:26px}
.s-div::before,.s-div::after{display:none}
.s-div .gdot{width:56px;height:2px}

/* ── ABOUT ── */
#about{background:var(--ivory);border-top:1px solid var(--line)}
.ab-intro{max-width:720px;margin:0 0 56px;font-size:16px;line-height:1.95;color:var(--muted)}
.ab-accordion{border-top:1px solid var(--line-strong);margin-bottom:64px}
.ab-item{border-bottom:1px solid var(--line);overflow:hidden}
.ab-trigger{width:100%;background:none;border:none;padding:30px 0;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:24px;text-align:left;color:inherit}
.ab-trigger-left{display:flex;align-items:baseline;gap:28px}
.ab-trigger-num{font-family:var(--serif);font-size:15px;font-weight:400;color:var(--muted);letter-spacing:2px;min-width:30px}
.ab-trigger-ti{font-family:var(--serif);font-size:clamp(21px,2.2vw,28px);font-weight:400;font-style:italic;color:var(--char);transition:color .3s}
.ab-item.open .ab-trigger-num{color:var(--turq-dk)}
.ab-trigger-icon{width:18px;height:18px;position:relative;flex-shrink:0;margin-right:4px}
.ab-trigger-icon::before,.ab-trigger-icon::after{content:'';position:absolute;background:var(--char);transition:transform .4s,opacity .4s,background .3s}
.ab-trigger-icon::before{width:18px;height:1px;top:50%;left:0;transform:translateY(-50%)}
.ab-trigger-icon::after{width:1px;height:18px;left:50%;top:0;transform:translateX(-50%)}
.ab-item.open .ab-trigger-icon::before{background:var(--turq);height:2px}
.ab-item.open .ab-trigger-icon::after{transform:translateX(-50%) rotate(90deg);opacity:0}
.ab-panel{max-height:0;overflow:hidden;transition:max-height .55s var(--ease)}
.ab-item.open .ab-panel{max-height:600px}
.ab-panel-inner{padding:2px 0 38px 58px}
.ab-panel-txt{font-size:15px;line-height:1.95;color:var(--muted);max-width:720px}
.ab-panel-txt p{margin-bottom:16px}
.ab-panel-txt p:last-child{margin-bottom:0}
.ab-vals{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.ab-val{font-size:12px;font-weight:400;letter-spacing:1px;color:var(--char);padding:8px 18px;background:var(--sand)}
.ab-closing{max-width:760px;margin:0;font-family:var(--serif);font-size:clamp(20px,2.2vw,27px);font-weight:400;font-style:italic;line-height:1.6;color:var(--char)}

/* ── TEAM ── */
.ab-item.open.ab-team-item .ab-panel{max-height:2400px}
.tm-loading{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:32px 0;animation:pulse 1.8s ease-in-out infinite}
.tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:36px 24px}
.tm-card{display:flex;flex-direction:column;align-items:center;text-align:center}
.tm-avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:1px solid var(--line);filter:grayscale(15%);transition:filter .4s,box-shadow .4s;background:var(--sand)}
.tm-card:hover .tm-avatar{filter:grayscale(0);box-shadow:0 0 0 3px var(--ivory),0 0 0 5px var(--turq)}
.tm-avatar-fallback{width:92px;height:92px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--serif);font-size:30px;font-style:italic}
.tm-name{font-family:var(--serif);font-size:18px;font-weight:500;color:var(--char);margin-top:16px;margin-bottom:4px;line-height:1.2}
.tm-role{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.tm-socials{display:flex;gap:12px;align-items:center;justify-content:center}
.tm-social{color:var(--muted);transition:color .2s;display:flex;align-items:center}
.tm-social:hover{color:var(--turq-dk)}
.tm-social svg{width:14px;height:14px;fill:currentColor}
@media(max-width:600px){
  .tm-grid{grid-template-columns:repeat(2,1fr);gap:28px 16px}
  .ab-panel-inner{padding:2px 0 28px 0}
  .ab-trigger{padding:22px 0}
  .ab-trigger-left{gap:16px}
}


/* ── TEAM: tarjeta de perfil (modal) ── */
.tm-open{background:none;border:none;padding:0;cursor:pointer;border-radius:50%;display:block}
.tm-open:focus-visible{outline:2px solid var(--turq);outline-offset:4px}
#tmModal{position:fixed;inset:0;z-index:600;background:rgba(41,43,41,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s}
#tmModal.open{opacity:1;pointer-events:auto}
.tmm-box{background:var(--ivory);width:100%;max-width:880px;max-height:calc(100vh - 48px);overflow:auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);position:relative;transform:translateY(18px);transition:transform .45s var(--ease)}
#tmModal.open .tmm-box{transform:none}
.tmm-img{background:var(--sand);min-height:100%;aspect-ratio:4/5;overflow:hidden}
.tmm-img img{width:100%;height:100%;object-fit:cover;display:block}
.tmm-ini{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--serif);font-style:italic;font-size:110px;color:var(--muted)}
.tmm-body{padding:60px 50px 46px;display:flex;flex-direction:column}
.tmm-role{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.tmm-name{font-family:var(--serif);font-style:italic;font-size:clamp(30px,3vw,42px);font-weight:400;color:var(--char);line-height:1.1}
.tmm-line{width:40px;height:2px;background:var(--turq);margin:22px 0 24px}
.tmm-bio{font-size:15px;line-height:1.85;color:var(--muted);white-space:pre-line;flex:1}
.tmm-socials{display:flex;gap:10px;margin-top:34px;flex-wrap:wrap}
.tmm-soc{width:42px;height:42px;border:1px solid var(--line-strong);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--char);text-decoration:none;transition:background .25s,color .25s,border-color .25s}
.tmm-soc svg{width:16px;height:16px;fill:currentColor}
.tmm-soc:hover{background:var(--char);border-color:var(--char);color:var(--ivory)}
.tmm-soc.is-wa{background:var(--turq);border-color:var(--turq);color:var(--char)}
.tmm-soc.is-wa:hover{background:var(--char);border-color:var(--char);color:var(--turq)}
.tmm-close{position:absolute;top:14px;right:14px;width:40px;height:40px;background:var(--ivory);border:none;border-radius:50%;font-size:17px;color:var(--char);cursor:pointer;z-index:2;transition:background .2s}
.tmm-close:hover{background:var(--sand)}
@media(max-width:700px){
  #tmModal{padding:0;align-items:flex-end}
  .tmm-box{grid-template-columns:1fr;max-height:92vh}
  .tmm-img{aspect-ratio:auto;height:38vh;min-height:0}
  .tmm-body{padding:30px 26px 34px}
}

/* ── SERVICES ── */
#services{background:var(--ivory)}
.srv-layout{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line)}
.srv-c{background:var(--sand);padding:60px 56px;position:relative;overflow:hidden;cursor:default;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end}
.srv-bg-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease,transform 1.4s ease;transform:scale(1.06);z-index:0}
/* Velo marfil: la foto se disuelve hacia el texto, como luz sobre piedra */

.srv-c.srv-visible .srv-ti{color:var(--ivory)}
.srv-c.srv-visible .srv-de{color:rgba(240,242,244,.85)}

.srv-de{font-size:15px;line-height:1.85;color:var(--muted);max-width:520px;transition:color .8s ease}
.srv-arr{position:absolute;bottom:34px;right:42px;width:20px;height:20px;opacity:0;transform:translateX(-6px);transition:opacity .4s,transform .4s;z-index:2}
.srv-arr svg{width:100%;height:100%;color:var(--turq-dk)}
.srv-c:first-child{min-height:440px}

}

/* ── PROPERTIES ── */

.prp-body{padding:28px 30px 34px}

.prp-lc{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.prp-ds{font-size:14px;line-height:1.75;color:var(--muted);margin-bottom:18px}
.prp-pr{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--char);margin-bottom:20px}
.prp-details{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.prp-detail{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.prp-sold{position:absolute;top:20px;left:20px;background:var(--char);color:var(--ivory);font-size:10px;letter-spacing:2px;padding:6px 12px;text-transform:uppercase}
.prp-loading{text-align:center;padding:80px 20px;color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;grid-column:1/-1;animation:pulse 1.8s ease-in-out infinite}
.filter-bar{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:48px;padding:28px 32px;background:var(--ivory)}
.filter-group{display:flex;flex-direction:column;gap:10px;flex:1;min-width:160px}
.filter-lbl{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted)}
.filter-sel{background:transparent;border:none;border-bottom:1px solid var(--line-strong);padding:8px 0;color:var(--char);font-family:var(--sans);font-size:15px;font-weight:300;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer;transition:border-color .3s;width:100%}
.filter-sel:focus{border-color:var(--turq)}

.prp-more-wrap{text-align:center;margin-top:56px}

.btn-more{padding:16px 48px;border:1px solid var(--char);color:var(--char);font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;background:transparent;transition:background .3s,color .3s;text-decoration:none;display:inline-block}

.prp-lk{font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--char);text-decoration:none;border-bottom:2px solid var(--turq);padding-bottom:3px;transition:color .2s,border-color .2s;display:inline-block}

/* ── SELECTOR DE PAÍS (catálogo) ── */

.cty-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;list-style:none;background:var(--ivory);border:1px solid var(--line);box-shadow:0 18px 40px -22px rgba(41,43,41,.4);padding:6px 0;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s,transform .25s var(--ease),visibility .25s}

.frm-r input,.frm-r textarea,.frm-r select{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line-strong);padding:10px 0;color:var(--char);font-family:var(--sans);font-size:16px;font-weight:300;outline:none;transition:border-color .3s;appearance:none;-webkit-appearance:none;border-radius:0}

footer{padding:64px 6% 48px;background:var(--char);display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center}

#formOverlay{position:fixed;inset:0;z-index:650;background:rgba(41,43,41,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s}
#formOverlay.open{opacity:1;pointer-events:auto}
.fo-box{background:var(--ivory);max-width:440px;width:100%;padding:52px 40px 44px;text-align:center;border-top:2px solid var(--turq)}
#foIcon{display:block;font-size:26px;margin-bottom:18px}
#foTitle{font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;color:var(--char);margin-bottom:12px}
#foSub{font-size:15px;line-height:1.75;color:var(--muted);margin-bottom:30px}
#foBtn{padding:15px 36px;background:var(--char);color:var(--ivory);border:none;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
#foBtn:hover{background:var(--turq);color:var(--char)}

/* ══════════ Áreas · Fall in Love with the Riviera Maya ══════════ */
.area-g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.area-c{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--sand);display:flex;align-items:flex-end;isolation:isolate}
.area-c.no-img{background-color:var(--sand);background-image:repeating-linear-gradient(0deg,rgba(240,242,244,.14) 0 1px,transparent 1px 9px),repeating-linear-gradient(0deg,rgba(41,43,41,.014) 0 2px,transparent 2px 37px)}
.area-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.02);transition:transform 1.2s var(--ease),filter .6s}
.area-c:hover .area-img{transform:scale(1.07)}
.area-ov{position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(41,43,41,.62) 0%,rgba(41,43,41,.18) 45%,rgba(41,43,41,0) 70%)}
.area-c.no-img .area-ov{display:none}
.area-body{padding:28px 26px 26px;color:var(--ivory)}
.area-c.no-img .area-body{color:var(--char)}
.area-nm{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(26px,2.3vw,32px);line-height:1.1;margin-bottom:10px}
.area-nm::after{content:'';display:block;width:28px;height:2px;background:var(--turq);margin-top:14px;transition:width .6s var(--ease)}
.area-c:hover .area-nm::after{width:64px}
.area-tx{font-size:14px;line-height:1.7;opacity:.9;margin-bottom:18px}
.area-lk{background:none;border:none;padding:0 0 3px;border-bottom:2px solid var(--turq);font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:inherit;cursor:pointer;transition:color .25s}
.area-lk:hover{color:var(--turq)}
.area-lk::before{content:'';position:absolute;inset:0}          /* toda la tarjeta es clicable */
@media(max-width:1024px){.area-g{grid-template-columns:repeat(2,1fr)}.area-c{aspect-ratio:4/5}}
@media(max-width:600px){
  .area-g{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;margin:0 -6%;padding:0 6% 8px;scrollbar-width:none}
  .area-g::-webkit-scrollbar{display:none}
  .area-c{flex:0 0 82%;scroll-snap-align:start;aspect-ratio:4/5}
}

/* Ficha del área */
#areaModal{position:fixed;inset:0;z-index:600;background:rgba(41,43,41,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s}
#areaModal.open{opacity:1;pointer-events:auto}
.am-box{background:var(--ivory);width:100%;max-width:920px;max-height:calc(100vh - 48px);overflow:auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);position:relative;transform:translateY(18px);transition:transform .45s var(--ease)}
#areaModal.open .am-box{transform:none}
.am-img{background:var(--sand);min-height:100%;aspect-ratio:4/5;overflow:hidden}
.am-img img{width:100%;height:100%;object-fit:cover;display:block}
.am-box.no-img{grid-template-columns:1fr;max-width:620px}
.am-box.no-img .am-img{display:none}

.am-name{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(32px,3.2vw,44px);color:var(--char);line-height:1.05}
.am-desc{font-size:16px;line-height:1.8;color:var(--char);margin-bottom:22px}
.am-row{padding:14px 0;border-top:1px solid var(--line)}
.am-row p{font-size:14.5px;line-height:1.75;color:var(--muted)}
.am-lbl{display:block;font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--char);margin-bottom:6px}
.am-help{font-size:14.5px;line-height:1.75;color:var(--muted);padding-top:14px;border-top:1px solid var(--line)}
.am-acts{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:center;margin-top:30px}
.am-acts .btn-g:hover{background:var(--char);color:var(--ivory)}
@media(max-width:700px){

/* ══════════ Instagram · Life Beyond the Property ══════════ */
#lifestyle{border-top:1px solid var(--line)}
.ig-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ig-follow{display:inline-flex;align-items:center;gap:10px;margin-bottom:64px;padding:12px 20px;border:1px solid var(--line-strong);color:var(--char);text-decoration:none;font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;transition:background .25s,color .25s,border-color .25s}
.ig-follow svg{width:16px;height:16px}
.ig-follow:hover{background:var(--char);border-color:var(--char);color:var(--ivory)}
.ig-g{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.ig-c{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--ivory)}
.ig-media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--sand)}
.ig-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1s var(--ease)}
.ig-c:hover .ig-media img{transform:scale(1.04)}
.ig-media.empty{background-image:repeating-linear-gradient(0deg,rgba(240,242,244,.14) 0 1px,transparent 1px 9px),repeating-linear-gradient(0deg,rgba(41,43,41,.014) 0 2px,transparent 2px 37px)}
.ig-media.empty{aspect-ratio:16/10}          /* sin portada: tarjeta más baja */
.ig-glyph{display:none}
.ig-media.empty .ig-glyph{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--char);opacity:.35;transition:opacity .4s,color .4s}
.ig-media.empty .ig-glyph svg{width:46px;height:46px}
.ig-c:hover .ig-media.empty .ig-glyph{opacity:.8;color:var(--turq-dk)}
.ig-n{position:absolute;top:16px;left:18px;font-family:var(--serif);font-size:15px;letter-spacing:2px;color:var(--char);opacity:.6}
.ig-media:not(.empty) .ig-n{color:var(--ivory);opacity:.85}
.ig-body{padding:22px 2px 0}
.ig-ti{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(22px,2vw,26px);color:var(--char);margin-bottom:8px}
.ig-tx{font-size:14.5px;line-height:1.75;color:var(--muted);margin-bottom:16px}
.ig-c:hover .prp-lk{color:var(--turq-dk)}
@media(max-width:900px){.ig-g{grid-template-columns:1fr 1fr}.ig-c:last-child{grid-column:1/-1}.ig-c:last-child .ig-media{aspect-ratio:16/9}}

.rev{opacity:0;transform:translateY(28px);transition:opacity .85s ease,transform .85s ease}
.rev.vis{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}

  .h-bg{transform:none}

}

// Tipo de cambio del día (open.er-api.com), guardado 12 h en el navegador y
// compartido por index, collection y property. Respaldo si la API falla:
const FALLBACK_RATES = {USD:0.058, CAD:0.079};          // 1 MXN = x USD / x CAD
const RATES_TTL = 12*60*60*1000;
let rates = Object.assign({}, FALLBACK_RATES);
let currency = (()=>{
  const ok = ['USD','MXN','CAD'];
  const u = new URLSearchParams(location.search).get('cur');
  if(ok.includes(u)) return u;
  try{ const s = localStorage.getItem('os_cur'); if(ok.includes(s)) return s; }catch(e){}
  return 'USD';
})();
function setCurrency(c){ currency = c; try{ localStorage.setItem('os_cur', c); }catch(e){} }
function loadCachedRates(){
  try{
    const c = JSON.parse(localStorage.getItem('os_rates')||'null');
    if(c && c.USD){ rates.USD = c.USD; rates.CAD = c.CAD || rates.CAD; return Date.now()-c.ts < RATES_TTL; }
  }catch(e){}
  return false;
}
async function fetchRates(){
  if(loadCachedRates()) return;
  try{
    const r = await fetch('https://open.er-api.com/v6/latest/MXN');
    const d = await r.json();
    if(d && d.rates && d.rates.USD){
      rates.USD = d.rates.USD; rates.CAD = d.rates.CAD || rates.CAD;
      try{ localStorage.setItem('os_rates', JSON.stringify({USD:rates.USD, CAD:rates.CAD, ts:Date.now()})); }catch(e){}
    }
  }catch(e){}
}
function parsePrice(val){ return parseFloat(String(val||'').replace(/[^0-9.]/g,''))||0; }
// Moneda del precio en el Sheet: columna opcional "Moneda" (USD / MXN). Vacío = MXN.
function srcCurrency(p){
  const m = String((p && (p['Moneda']||p['moneda']||p['Currency']||p['currency'])) || '').trim().toUpperCase();
  return m === 'USD' ? 'USD' : 'MXN';
}
function priceMXN(val, p){ const n = parsePrice(val); return srcCurrency(p)==='USD' ? n/rates.USD : n; }
function priceIn(cur, val, p){ const m = priceMXN(val,p); return cur==='MXN' ? m : m*rates[cur]; }
// Redondeo: < 100k → 500 · < 1M → 1,000 · ≥ 1M → 5,000
function roundNice(x){ const step = x<100000 ? 500 : x<1000000 ? 1000 : 5000; return Math.round(x/step)*step; }
const CUR_SYM = {USD:'US$', CAD:'CA$', MXN:'MXN $'};
// Precio principal en la moneda elegida (≈ cuando es conversión)
function formatCurrency(val, p){
  const n = parsePrice(val);
  if(!n) return '';
  const src = srcCurrency(p);
  if(currency === src) return CUR_SYM[src] + Math.round(n).toLocaleString('en-US');
  return '≈ ' + CUR_SYM[currency] + roundNice(priceIn(currency, val, p)).toLocaleString('en-US');
}
// Precio de lista original, como referencia bajo el convertido ('' si no hay conversión)
function priceRef(val, p){
  const n = parsePrice(val);
  const src = srcCurrency(p);
  if(!n || currency === src) return '';
  return CUR_SYM[src] + Math.round(n).toLocaleString('en-US');
}
loadCachedRates();
function formatPrice(val, p){ return formatCurrency(val, p); }

function imgUrl(url, w, h){
  if(!url) return '';
  if(url.includes('cloudinary')){
    // URLs con brackets en el public_id fallan con transformaciones — servir original
    if(url.includes('%5B') || url.includes('%5b') || url.includes('%5D') || url.includes('%5d')) return url;
    const t = 'w_'+w+',q_auto,f_auto,c_fill'+(h?',h_'+h:'');
    if(url.includes('/upload/'+t)) return url;
    return url.replace('/upload/', '/upload/'+t+'/');
  }
  return url;
}

// Parse DD/MM/YYYY HH:MM:SS → comparable number
function parseTimestamp(ts){
  if(!ts) return 0;
  const s = String(ts).trim();
  // DD/MM/YYYY HH:MM:SS
  const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})$/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]).getTime();
  // fallback: try native parse
  const d = new Date(s);
  return isNaN(d) ? 0 : d.getTime();
}

function getFiltered(){
  return allFetched
    .filter(r => rowCountry(r) === country)
    .sort((a,b) => parseTimestamp(b['timestamp']||b['Timestamp']||b['TIMESTAMP']) -

}

}


// ── GROUP BY NAME ──
function groupByName(data){
  const parseNum = v => parseFloat(String(v||0).replace(/[^0-9.]/g,''))||0;
  const groups = {};
  data.forEach(p=>{
    const name = (p['Nombre']||'').trim();
    if(!groups[name]) groups[name] = [];
    groups[name].push(p);
  });
  return Object.values(groups).map(units=>{
    // Representative = first item (already sorted by timestamp desc from getFiltered)
    const rep = units[0];
    // Within group: sort units by Unidad alphanumerically
    const sortedUnits = [...units].sort((a,b)=>{
      const ua = String(a['Unidad']||'').trim();
      const ub = String(b['Unidad']||'').trim();
      // Numeric if both are numbers, else alphabetical
      const na = parseNum(ua), nb = parseNum(ub);
      if(na && nb) return na - nb;
      return ua.localeCompare(ub, 'es', {numeric:true});
    });
    return Object.assign({}, rep, {_units: sortedUnits, _unitCount: units.length});
  });
}

function areaFallbackImg(a){
  if(a.img) return imgUrl(a.img, 900, 1100);
  const row = allFetched.find(r => (r['Ciudad']||'').trim().toLowerCase() === a.city);
  if(!row) return '';
  const u = IMG_COLS.map(c=>row[c]).find(x=>x && x.trim());
  return u ? imgUrl(u, 900, 1100) : '';
}
function renderAreas(){
  const t = L[lang];
  g('arEy').textContent = t.arEy;
  g('arTi').textContent = t.arTi;
  g('arTx').textContent = t.arTx;
  g('areaG').innerHTML = AREAS.filter(a=>a.show).map(a=>`
    <article class="area-c no-img rev" data-area="${a.key}">
      <div class="area-ov"></div>
      <div class="area-body">
        <h3 class="area-nm">${a.name}</h3>
        <p class="area-tx">${a.desc[lang]}</p>
        <button type="button" class="area-lk" onclick="openArea('${a.key}')">${t.arCta}</button>
      </div>
    </article>`).join('');
  fillAreaImages();
}
// Agrega la foto a las tarjetas que aún no la tienen (también al terminar de cargar el catálogo)
function fillAreaImages(){
  // si la ficha se abrió (p. ej. desde #area-…) antes de cargar el catálogo, refrescarla con foto
  if(_areaOpenKey && g('areaModal').querySelector('.am-box.no-img') && allFetched.length){ const k=_areaOpenKey; const f=_areaLastFocus; openArea(k, true); _areaLastFocus=f; }
  AREAS.filter(a=>a.show).forEach(a=>{
    const card = document.querySelector(`.area-c[data-area="${a.key}"]`);
    if(!card || card.querySelector('.area-img')) return;
    const src = areaFallbackImg(a);
    if(!src) return;
    const im = document.createElement('img');
    im.className = 'area-img'; im.alt = ''; im.loading = 'lazy'; im.decoding = 'async';
    im.onload  = ()=>card.classList.remove('no-img');
    im.onerror = ()=>im.remove();                       // si la imagen falla, queda la tarjeta tipográfica
    im.src = src;
    card.prepend(im);
  });
}

let _areaLastFocus = null, _areaOpenKey = null;
function openArea(key, fromHash){
  const a = AREAS.find(x=>x.key===key && x.show); if(!a) return;
  _areaOpenKey = key;
  const t = L[lang];
  const img = areaFallbackImg(a);
  const box = g('areaModal').querySelector('.am-box');
  g('amImg').innerHTML = img ? `<img src="${img}" alt="${a.name}" onerror="this.closest('.am-box').classList.add('no-img');this.remove()">` : '';
  box.classList.toggle('no-img', !img);            // sin foto: ficha de una sola columna
  g('amEy').textContent = t.arRegion;
  g('amName').textContent = a.name;
  g('amDesc').textContent = a.desc[lang];
  const det = (a.details && a.details[lang]) || {};
  const lbl = AREA_DETAIL_LBL[lang];
  const rows = Object.keys(lbl).filter(k=>det[k] && String(det[k]).trim());
  g('amDetails').innerHTML = rows.length
    ? rows.map(k=>`<div class="am-row"><span class="am-lbl">${lbl[k]}</span><p>${det[k]}</p></div>`).join('')
    : `<p class="am-help">${t.arHelp}</p>`;
  const props = 'collection.html?city=' + encodeURIComponent(a.city) + (lang==='es' ? '&lang=es' : '');
  const msg = lang==='es' ? `Hola Erika, me gustaría saber más sobre ${a.name}.` : `Hi Erika, I’d like to know more about ${a.name}.`;
  g('amActs').innerHTML = `
    <a class="btn-g" href="${props}">${t.arProps.replace('{a}', a.name)}</a>
    <a class="am-ask prp-lk" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${t.arAsk.replace('{a}', a.name)}</a>`;
  _areaLastFocus = document.activeElement;
  g('areaModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  if(!fromHash) history.replaceState(null, '', '#area-' + key);
  setTimeout(()=>{ const c = g('areaModal').querySelector('.tmm-close'); if(c) c.focus(); }, 50);
  if(typeof gtag === 'function') gtag('event','area_open',{event_category:'Areas',area:key,language:lang});
}
function closeArea(){
  _areaOpenKey = null;
  g('areaModal').classList.remove('open');
  document.body.style.overflow = '';
  if(location.hash.startsWith('#area-')) history.replaceState(null, '', location.pathname + location.search + '#areas');
  if(_areaLastFocus) _areaLastFocus.focus();
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && g('areaModal') && g('areaModal').classList.contains('open')) closeArea(); });
// Enlace directo: index.html#area-tulum
window.addEventListener('load', ()=>{ if(location.hash.startsWith('#area-')) openArea(location.hash.slice(6), true); });

function loadTeam(){
  Papa.parse(TEAM_CSV, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(res){
      const container = document.getElementById('tmContainer');
      if(!container) return;

      const rows = (res.data||[]).filter(r=>{
        const status = (r['Status']||'').trim();
        return status === 'TRUE' || status === 'true' || status === '1';
      });

      if(!rows.length){
        container.innerHTML = `<p style="font-size:12px;color:var(--dim);letter-spacing:2px">— TEAM COMING SOON —</p>`;
        return;
      }

      // Ordenar por jerarquía de rol
      rows.sort((a,b) => roleRank(a['Rol']) - roleRank(b['Rol']));

      _tmRows = rows;
      function cardHTML(r, i){
        const name   = (r['Assignee']||'').trim();
        const rol    = (r['Rol']||'').trim();
        const picUrl = (r['Pic url']||r['Pic_url']||r['pic url']||'').trim();
        const fb     = (r['Facebook']||'').trim();
        const ig     = (r['Instagram']||'').trim();
        const li     = (r['LinkedIn']||r['Linkedin']||'').trim();
        const yt     = (r['YouTube']||r['Youtube']||r['youtube']||'').trim();

        const initial = name ? name.charAt(0).toUpperCase() : '?';
        const imgEl = picUrl
          ? `<img class="tm-avatar" src="${picUrl}" alt="${name}" loading="lazy" onerror="tmFallback(this)" data-initial="${initial}">`
          : `<div class="tm-avatar-fallback">${initial}</div>`;

        const socials = [
          fb ? `<a class="tm-social" href="${fb.startsWith('http')?fb:'https://'+fb}" target="_blank" rel="noopener" title="Facebook">${FB_SVG}</a>` : '',
          ig ? `<a class="tm-social" href="${ig.startsWith('http')?ig:'https://'+ig}" target="_blank" rel="noopener" title="Instagram">${IG_SVG}</a>` : '',
          li ? `<a class="tm-social" href="${li.startsWith('http')?li:'https://'+li}" target="_blank" rel="noopener" title="LinkedIn">${LI_SVG}</a>` : '',
          yt ? `<a class="tm-social" href="${yt.startsWith('http')?yt:'https://'+yt}" target="_blank" rel="noopener" title="YouTube">${YT_SVG}</a>` : ''
        ].join('');

        return `<div class="tm-card">
          <button type="button" class="tm-open" onclick="openTm(${i})" aria-label="${name}">${imgEl}</button>
          <p class="tm-name">${name}</p>
          <p class="tm-role">${rol}</p>
          ${socials ? `<div class="tm-socials">${socials}</div>` : ''}
        </div>`;
      }

      container.innerHTML = `<div class="tm-grid">${rows.map((r,i)=>cardHTML(r,i)).join('')}</div>`;
      observe();

      if(typeof gtag === 'function'){
        gtag('event','team_view',{
          event_category:'About Us',
          members_count: rows.length,
          language: lang
        });
      }
    },
    error: function(err){
      console.error('[Team] Error PapaParse:', err);
      const c = document.getElementById('tmContainer');
      if(c) c.innerHTML = `<p style="font-size:11px;letter-spacing:2px;color:var(--dim)">— TEAM UNAVAILABLE —</p>`;
    }
  });
}

    return `<div class="unit-item" onclick="selectUnit(${i})">
      <div class="unit-item-left">
        <span class="unit-item-name">${unit}</span>
        ${meta?`<span class="unit-item-meta">${meta}</span>`:''}
      </div>
      <span class="unit-item-price">${price}</span>
      <span class="unit-item-arr">→</span>
    </div>`;
  }).join('');
  g('unitPanel').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeUnitPanel(){
  g('unitPanel').classList.remove('open');
  document.body.style.overflow='';
}

function selectUnit(idx){
  const u = _unitPanelUnits[idx];
  if(!u) return;
  closeUnitPanel();
  const id = u['home_listing_id'] || encodeURIComponent(u['Nombre']||'');
  window.location.href = `property.html?id=${id}&from=index&lang=${lang}`;
}

function bindCardClicks(){
  document.querySelectorAll('#prpG .prp-c').forEach((card,idx)=>{
    const p = renderedProps[idx];
    card.onclick = ()=>{
      if(!p) return;
      if(p._unitCount > 1){
        _unitPanelUnits = p._units;
        openUnitPanel(p._units);
      } else {
        const id = p['home_listing_id'] || encodeURIComponent(p['Nombre']||'');
        window.location.href = `property.html?id=${id}&from=index&lang=${lang}`;
      }
    };
  });
  document.querySelectorAll('#prpG .prp-lk').forEach(a=>{ a.onclick = e=>e.stopPropagation(); });
}

const WEBHOOK = 'https://n8n-production-3be9.up.railway.app/webhook/822a51cd-42c4-4f6c-a7f1-5d902b5d4830';

function showFormOverlay(type, title, sub, btnTxt){
  const icon = document.getElementById('foIcon');
  icon.textContent = type === 'success' ? '✦' : '◇';
  icon.style.color = type === 'success' ? 'var(--turq)' : 'var(--char)';

  document.getElementById('formOverlay').classList.add('open');
  setTimeout(()=>btn.focus(), 50);
  if(type==='success') setTimeout(closeFormOverlay, 6000);
}

function closeFormOverlay(){
  document.getElementById('formOverlay').classList.remove('open');
}

function submitContactForm(){
  const M        = L[lang].msg;
  const val      = id => (document.getElementById(id)?.value||'').trim();
  const name     = val('cf-name');
  const email    = val('cf-email');
  const phone    = [val('cf-dialcode'), val('cf-phone')].filter(Boolean).join('').replace(/\D/g,'');
  const method   = val('cf-method') || 'whatsapp';
  const intSel   = document.getElementById('cf-interest');
  const interest = intSel && intSel.value ? intSel.options[intSel.selectedIndex].text : '';
  const interestCode = intSel ? intSel.value : '';
  const budget   = val('cf-budget');
  const userMsg  = val('cf-message');
  const btn      = document.getElementById('cf-submit');

  // Validación: nombre + el dato del medio elegido (correo válido o teléfono)
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const phoneOk = phone.length >= 7;
  if(!name){ showFormOverlay('error', M.errT, M.errN, M.tryA); return; }
  if((method==='email' && !emailOk) || (method!=='email' && !phoneOk && !emailOk)){
    showFormOverlay('error', M.errT, M.errC, M.tryA); return;
  }

  // El medio de contacto y el presupuesto también viajan dentro de "message" para que lleguen aunque el flujo de n8n solo lea los campos originales
  const methodLbl = document.getElementById('cf-method')?.selectedOptions[0]?.text || method;
  const extra   = [`Preferred contact: ${methodLbl}`, budget ? `Budget: ${budget}` : ''].filter(Boolean).join(' · ');
  const message = [userMsg, extra].filter(Boolean).join('\n\n— ');

  btn.disabled = true;
  btn.textContent = M.sending;
  btn.style.background = 'var(--muted)';

  fetch(WEBHOOK, {
    method: 'POST',
    mode: 'cors',
    headers: {
      'Content-Type': 'application/json',
      'X-Source-Token': 'LRS-2025-xK9mP2qR7nJ4wT8v'
    },
    body: JSON.stringify({
      uid: crypto.randomUUID(),
      name, email, phone, interest, message,
      contact_method: method,
      interest_code: interestCode,
      budget,
      source: 'oceanside-web',
      lang,
      timestamp: new Date().toLocaleString('sv-SE',{timeZone:'America/Cancun'}).replace(' ','T')
    })
  })
  .then(r => {
    if(!r.ok) throw new Error('HTTP '+r.status);
    btn.disabled = false;
    btn.textContent = L[lang].fS;
    btn.style.background = '';
    ['cf-name','cf-email','cf-dialcode','cf-phone','cf-message'].forEach(id=>{
      const el = document.getElementById(id); if(el) el.value='';
    });
    ['cf-interest','cf-budget','cf-method'].forEach(id=>{ const el = document.getElementById(id); if(el) el.selectedIndex = 0; });
    if(typeof gtag!=='undefined') gtag('event','generate_lead',{method:'contact_form',contact_method:method,interest:interestCode});
    showFormOverlay('success', M.okT, M.okS, M.close);
  })
  .catch(err=>{
    console.error('Form submit error:', err.message || err);
    btn.disabled = false;
    btn.textContent = L[lang].fS;
    btn.style.background = '';
    const subj = encodeURIComponent('Contacto OceanSide — '+name);
    const body = encodeURIComponent('Nombre: '+name+'\nEmail: '+email+'\nTeléfono: '+phone+'\nInterés: '+interest+'\n\n'+message);
    const mailto = 'mailto:erika.oceansidemx@gmail.com?subject='+subj+'&body='+body;
    showFormOverlay('error', M.failT, M.failS, M.mail);
    document.getElementById('foBtn').onclick = ()=>{ window.location.href = mailto; closeFormOverlay(); };
  });
}

// ── FLOATING LOGO (después de render para que DOM esté listo) ──
window.addEventListener('load', function(){
  const fLogo = document.getElementById('fLogo');
  if(!fLogo) return;

  function lerp(a,b,t){return a+(b-a)*t}
  function eio(t){return t<.5?2*t*t:-1+(4-2*t)*t}

  function updateLogo(){
    const sy  = window.scrollY;
    const vw  = window.innerWidth;
    const vh  = window.innerHeight;
    const p   = eio(Math.min(sy / (vh * 0.42), 1));

    const startW = Math.min(200, vw * 0.32);
    const startX = (vw - startW) / 2;
    const startY = vh * 0.09;

    const ref = document.getElementById('navLogoRef');
    const nr  = ref.getBoundingClientRect();
    const endW = 44;
    const endX = nr.left;
    const endY = nr.top;

    fLogo.style.left  = lerp(startX, endX, p) + 'px';
    fLogo.style.top   = lerp(startY, endY, p) + 'px';
    fLogo.style.width = lerp(startW, endW, p) + 'px';
  }

  window.addEventListener('scroll', updateLogo, {passive:true});
  window.addEventListener('resize', updateLogo);
  updateLogo();
});
</script>
